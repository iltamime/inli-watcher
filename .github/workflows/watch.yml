name: Surveillance in'li

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
     group: inli-watcher
     cancel-in-progress: true

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install requests beautifulsoup4
      - name: Lancer la vérification
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python inli_watcher.py
      - name: Sauvegarder les annonces déjà vues
        run: |
          git config user.name "inli-watcher-bot"
          git config user.email "actions@github.com"
          git add inli_seen_ids.json
          git diff --quiet --cached || git commit -m "Mise a jour des annonces vues"
          git push
